<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Enhanced Filtered Force-Directed Graphs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;

    h1 {
            text-align: center;

      border-radius: 5px;
    }

    .dashboard {
      display: flex;

      flex-wrap: wrap;

      margin: 20px 0;

    .chart-container {
      background-color: #ffffff;
      border: 1px solid #562020;

      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
      padding: 15px;
      width: 400px;
      height: 400px;

    svg.chart {
  width: 100%; /* Set to 100% to fill parent container */

}

    .chart-container h3 {
      text-align: center;
      font-size: 16px;

      margin-bottom: 10px;

    .details-panel {
      background-color: #ffffff;
      border: 2px solid #007bff;

    .details-panel h3 {
      text-align: center;
      color: #007bff;
      margin-bottom: 10px;
    }

    .tooltip {
      position: absolute;
      text-align: center;
      padding: 8px;
      font-size: 12px;
      background: rgba(12, 105, 109, 0.9);
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    svg {
      border: 1px solid #c1c4cc;
      border-radius: 8px;
    }
  
.legend div {
  display: flex;
  align-items: center;
  font-size: 16px;
  white-space: nowrap; /* Prevent text wrapping */
}

.legend {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 200px; /* Adjust spacing between items */
  flex-wrap: wrap; /* Allow wrapping for small screens if necessary */
  margin: 20px 0; /* Space around the legend */
}


.legend div span {
  width: 20px;
  height: 20px;
  display: inline-block;
  margin-right: 10px; /* More space between color circle and label */
  border-radius: 50%; /* Make it circular */
}
.breadcrumb-container {
    margin: 10px 0;
    padding: 5px;
    font-size: 14px;
    background: #f9f9f9;
    border: 1px solid #ddd;
    border-radius: 5px;
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }

  .breadcrumb-container span {
    cursor: pointer;
    color: #007bff;
    text-decoration: underline;
  }

  .breadcrumb-container span:hover {
    color: #0056b3;
  }

  .breadcrumb-separator {
    color: #555;
  }

    @media (max-width: 768px) {
      .chart-container {
        width: 100%;
        height: 480px;
      }

      .details-panel {
        width: 90%;
      }
    }
  </style> 

</head>
<body>
 <!--  <h1>Enhanced Filtered Force-Directed Graphs</h1> -->
  <div id="legend" class="legend"></div>

  <div class="filter-container">
    <label><input type="checkbox" id="filter-tobacco-affected-tb-patients" checked> Show Tobacco Affected TB Patients</label>
    <label><input type="checkbox" id="filter-alcoholic-tb-patients" checked> Show Alcoholic TB Patients</label>
    <label><input type="checkbox" id="filter-diabetic-tb-patients" checked> Show Diabetic TB Patients</label>
  </div>

  <div class="search-container">
    <input type="text" id="search-box" placeholder="Search for a State/UT..." />
    <button onclick="searchNode()">Search</button>
    <button onclick="resetZoom()">Reset Zoom</button>
    <button onclick="resetAll()">Reset All</button>
    <button onclick="focusOnCategory('Tobacco Affected TB Patients')">Focus on Tobacco Nodes</button>
    <button onclick="focusOnCategory('Alcoholic TB Patients')">Focus on Alcohol Nodes</button>
    <button onclick="focusOnCategory('Diabetic TB Patients')">Focus on Diabetes Nodes</button>
    <button onclick="resetHighlights()">Reset Highlights</button>
    <button id="save-state-button">Save State</button> <!-- Added Save State button -->
    <button id="reset-state-button">Reset State</button>


  </div>

  <div class="dashboard">
    <div id="tobacco-container" class="chart-container">
      <h3>Tobacco Affected TB Patients</h3>
      <button class="save-graph-button" data-target="tobacco-graph">Save Graph as Image</button>
      <div class="breadcrumb-container" id="breadcrumb-tobacco"></div>
      <svg id="tobacco-graph" class="chart"></svg>
    </div>
    <div id="alcohol-container" class="chart-container">
      <h3>Alcoholic TB Patients</h3>
      <button class="save-graph-button" data-target="alcohol-graph">Save Graph as Image</button>
      <div class="breadcrumb-container" id="breadcrumb-alcohol"></div>
      <svg id="alcohol-graph" class="chart"></svg>
    </div>
    <div id="diabetes-container" class="chart-container">
      <h3>Diabetic TB Patients</h3>
      <button class="save-graph-button" data-target="diabetes-graph">Save Graph as Image</button>
      <div class="breadcrumb-container" id="breadcrumb-diabetes"></div>
      <svg id="diabetes-graph" class="chart"></svg>
    </div>
  </div>

  <div id="details-panel" class="details-panel" style="display: none;">
    <h3>Node Details</h3>
    <p id="details-content">Click a node to view details.</p>
  </div>

  <script>
    const colorScales = [
      d3.scaleOrdinal(d3.schemeCategory10), // Colorful nodes for Tobacco dataset
      d3.scaleOrdinal(d3.schemeSet2),       // Colorful nodes for Alcohol dataset
      d3.scaleOrdinal(d3.schemePastel1)     // Colorful nodes for Diabetes dataset
    ];

    const rootNodeColorMap = {
      "Tobacco Affected TB Patients": "#800000", // Maroon for Tobacco root node
      "Alcoholic TB Patients": "#888", // Grey for Alcohol root node
      "Diabetic TB Patients": "#000" // Black for Diabetes root node
    };

    const datasets = [
      {
        id: "tobacco-graph",
        containerId: "tobacco-container",
        checkboxId: "filter-tobacco-affected-tb-patients",
        column: "no_of_tobacco-tb_patients_with_known_tobacco_usage_status,_of_notified)-public",
        label: "Tobacco Affected TB Patients",
        color: colorScales[0],
        rootColor: rootNodeColorMap["Tobacco Affected TB Patients"]
      },
      {
        id: "alcohol-graph",
        containerId: "alcohol-container",
        checkboxId: "filter-alcoholic-tb-patients",
        column: "no_of_tb_-_alcohol-alcohol_users_linked_with_deaddiction_centres,_of_alcohol_users)-total",
        label: "Alcoholic TB Patients",
        color: colorScales[1],
        rootColor: rootNodeColorMap["Alcoholic TB Patients"]
      },
      {
        id: "diabetes-graph",
        containerId: "diabetes-container",
        checkboxId: "filter-diabetic-tb-patients",
        column: "no_of_tb_-_diabetes-tb_patients_with_known_dm_status,_of_notified)-public",
        label: "Diabetic TB Patients",
        color: colorScales[2],
        rootColor: rootNodeColorMap["Diabetic TB Patients"]
      }
    ];

    const detailsPanel = d3.select("#details-panel");
    const detailsContent = d3.select("#details-content");
    const legendContainer = d3.select("#legend");

    function createLegend(colorScale, label, rootColor) {
      const legendItem = legendContainer.append("div")
        .attr("data-label", label) // Added data attribute to help with filtering legend items
        .on("click", () => focusOnCategory(label));
      legendItem.append("span").style("background-color", rootColor); // Root node color in legend
      legendItem.append("span").text(label);
    }

    d3.csv("India_Filled_Extended_With_Timestamp.csv").then(data => {
      // Filter out rows where all metrics are zero
      const filteredData = data.filter(d => {
        return +d["no_of_tobacco-tb_patients_with_known_tobacco_usage_status,_of_notified)-public"] > 0 ||
               +d["no_of_tb_-_alcohol-alcohol_users_linked_with_deaddiction_centres,_of_alcohol_users)-total"] > 0 ||
               +d["no_of_tb_-_diabetes-tb_patients_with_known_dm_status,_of_notified)-public"] > 0;
      });

      const slicedData = filteredData.slice(0, 100); // Use the filtered data

      datasets.forEach(dataset => {
        createLegend(dataset.color, dataset.label, dataset.rootColor);

        // Filter rows where the specific column has non-zero values
        const datasetFilteredData = slicedData.filter(d => +d[dataset.column] > 0);
        if (datasetFilteredData.length === 0) {
          // If no data is available for a particular dataset, add a fallback node
          datasetFilteredData.push({ "state/uts": "No Data Available", [dataset.column]: 0 });
        }
        createForceGraph(datasetFilteredData, dataset);

        // Show container by default
        document.getElementById(dataset.containerId).style.display = "block";
      });

      updateLegendVisibility();

      // Add filter event listeners
      datasets.forEach(dataset => {
        const checkbox = document.getElementById(dataset.checkboxId);
        checkbox.addEventListener("change", () => {
          const container = document.getElementById(dataset.containerId);
          const nodes = d3.selectAll(`#${dataset.id} .nodes circle`);
          const links = d3.selectAll(`#${dataset.id} .links line`);

          nodes.style("opacity", checkbox.checked ? 1 : 0.1);
          links.style("opacity", d => checkbox.checked ? 1 : 0.1);

          container.style.display = checkbox.checked ? "block" : "none";

          updateLegendVisibility();
        });
      });
    });


    
    function updateLegendVisibility() {
      legendContainer.selectAll("div").style("display", function() {
        const label = d3.select(this).attr("data-label");
        const checkbox = document.getElementById(`filter-${label.toLowerCase().replace(/ /g, '-').replace(/tb-patients/g, 'tb-patients')}`);
        return checkbox && checkbox.checked ? "flex" : "none";
      });
    }
 
function createForceGraph(data, dataset) {
    const svg = d3.select(`#${dataset.id}`);
    const width = svg.node().parentNode.clientWidth;
    const height = svg.node().parentNode.clientHeight;

    // Add a <g> element for graph content
    const graphGroup = svg.append("g").attr("class", "graph-group");

    const zoom = d3.zoom()
        .scaleExtent([0.5, 5]) // Allow zoom levels from 50% to 500%
        .on("zoom", (event) => {
            graphGroup.attr("transform", event.transform); // Apply zoom transformation
        });

    svg.call(zoom); // Attach zoom behavior to the SVG

    // Create hierarchy
    const { nodes, links } = createHierarchy(data, dataset);

    const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(100))
        .force("charge", d3.forceManyBody().strength(-200))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(20));

    const link = graphGroup.append("g")
        .attr("class", "links")
        .selectAll("line")
        .data(links)
        .join("line")
        .attr("stroke-width", 1)
        .attr("stroke", d => d.type === "root" ? "#444" : "#999")
        .attr("opacity", 0.7);

    const node = graphGroup.append("g")
        .attr("class", "nodes")
        .selectAll("circle")
        .data(nodes)
        .join("circle")
        .attr("r", d => (d.group === 0 ? 12 : d.group === 1 ? 10 : 8)) // Differentiated radius for groups
        .attr("fill", (d, i) => d.group === 0 ? dataset.rootColor : dataset.color(i))
        .on("mouseover", (event, d) => {
            d3.select(event.target).attr("stroke", "#ff5722").attr("stroke-width", 2);
            showTooltip(event, d, links);
        })
        .on("mouseout", (event, d) => {
            d3.select(event.target).attr("stroke", "#000").attr("stroke-width", 1);
            hideTooltip();
        })
        .on("click", (event, d) => { 
          showDetails(d, links); // Display details
          highlightStateAcrossAllGraphs(d.id); // Highlight across graphs

          // Build hierarchical path for breadcrumbs
          const breadcrumbContainerId = `breadcrumb-${dataset.id.replace("-graph", "")}`;
          console.log("Breadcrumb Container ID:", breadcrumbContainerId); // Debugging

          const path = [];
          let currentNode = d;

          // Traverse up the hierarchy to build the path
          while (currentNode) {
              path.unshift({
                  id: currentNode.id,
                  label: currentNode.label || currentNode.id // Use label if available
              });
              currentNode = nodes.find(node => node.id === currentNode.parent);
          }

          updateBreadcrumbs(breadcrumbContainerId, path);
          highlightFullPath(path, links, graphGroup);

      })

        .call(drag(simulation));

    simulation.on("tick", () => {
        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        node
            .attr("cx", d => d.x)
            .attr("cy", d => d.y);
    });

    function drag(simulation) {
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        return d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended);
    }
}

function showTooltip(event, d, links) {
    const connections = links.filter(l => l.source.id === d.id || l.target.id === d.id).length;
    d3.select("body").append("div")
        .attr("class", "tooltip")
        .style("left", `${event.pageX + 10}px`)
        .style("top", `${event.pageY + 10}px`)
        .html(`
            <b>${d.id}</b><br>
            <b>Value:</b> ${d.value}<br>
            <b>Connections:</b> ${connections} relationships
        `);
}



      function hideTooltip() {
        d3.select(".tooltip").remove();
      }

      function showDetails(node, links) {
    const connections = links.filter(l => l.source.id === node.id || l.target.id === node.id).length;

    // Define regions and their states (consistent with your hierarchy mapping)
    const regionMapping = {
        North: ["Delhi", "Punjab", "Haryana", "Uttarakhand", "Jammu & Kashmir", "Himachal Pradesh", "Chandigarh"],
        South: ["Kerala", "Karnataka", "Tamil Nadu", "Andhra Pradesh", "Telangana", "Puducherry"],
        East: ["West Bengal", "Odisha", "Bihar", "Jharkhand", "Sikkim"],
        West: ["Rajasthan", "Gujarat", "Maharashtra", "Goa", "Dadra & Nagar Haveli and Daman & Diu"],
        Central: ["Madhya Pradesh", "Chhattisgarh", "Uttar Pradesh"],
        Northeast: ["Assam", "Meghalaya", "Nagaland", "Manipur", "Tripura", "Arunachal Pradesh", "Mizoram"],
    };

    // Determine the region of the state
    let region = "Unknown Region";
    for (const [key, states] of Object.entries(regionMapping)) {
        if (states.includes(node.details["state/uts"])) {
            region = key;
            break;
        }
    }

    if (node.details) {
        detailsPanel.style("display", "block");
        detailsContent.html(`
            <b>State/UT:</b> ${node.details["state/uts"]}<br>
            <b>Region:</b> ${region}<br>
            <b>Tobacco Patients:</b> ${node.details["no_of_tobacco-tb_patients_with_known_tobacco_usage_status,_of_notified)-public"] || 0}<br>
            <b>Alcohol Patients:</b> ${node.details["no_of_tb_-_alcohol-alcohol_users_linked_with_deaddiction_centres,_of_alcohol_users)-total"] || 0}<br>
            <b>Diabetes Patients:</b> ${node.details["no_of_tb_-_diabetes-tb_patients_with_known_dm_status,_of_notified)-public"] || 0}<br>
            <b>Connections:</b> ${connections} total links
        `);
    }
    else {
        detailsPanel.style("display", "none");
    } 
}


function searchNode() {
    const searchValue = document.getElementById('search-box').value.toLowerCase();
    let found = false;

    datasets.forEach(dataset => {
        const svg = d3.select(`#${dataset.id}`);
        const graphGroup = svg.select(".graph-group");
        
        // Reset all nodes and links for this dataset
        graphGroup.selectAll(".nodes circle")
            .style("stroke", "#000")
            .style("stroke-width", "1.5px")
            .style("opacity", 0.3); // Dim all nodes

        graphGroup.selectAll(".links line")
            .style("stroke", "#999")
            .style("stroke-width", 1)
            .style("opacity", 0.3); // Dim all links

        // Find the searched node
        const targetNode = graphGroup.selectAll(".nodes circle")
            .filter(d => d.id.toLowerCase() === searchValue);

        if (!targetNode.empty()) {
            found = true;

            // Highlight the searched node
            targetNode
                .style("stroke", "#ff0000")
                .style("stroke-width", "3px")
                .style("opacity", 1);

            // Highlight the path from root to region to state
            const targetNodeData = targetNode.data()[0];
            highlightPath(graphGroup, targetNodeData.id);
        }
    });

    if (!found) {
        console.warn(`No node found for search value: "${searchValue}"`);
    }
}

// Helper function to highlight the path from root to region to state
function highlightPath(graphGroup, stateId) {
    let currentId = stateId;

    while (currentId) {
        // Highlight the node
        graphGroup.selectAll(".nodes circle")
            .filter(d => d.id === currentId)
            .style("stroke", "#ff5722")
            .style("stroke-width", "3px")
            .style("opacity", 1);

        // Highlight the link connecting this node to its parent
        const parentLink = graphGroup.selectAll(".links line")
            .filter(d => d.target.id === currentId);

        parentLink
            .style("stroke", "#ff5722")
            .style("stroke-width", "2px")
            .style("opacity", 1);

        // Move to the parent node
        const parentData = parentLink.data()[0];
        currentId = parentData ? parentData.source.id : null;
    }
}
      function resetAll() {
          d3.selectAll(".nodes circle")
            .style("stroke", "#000")
            .style("stroke-width", "1.5px")
            .style("opacity", 1);

          d3.selectAll(".links line")
            .style("stroke", "#999")
            .style("stroke-width", 1)
            .style("opacity", 1);

          resetZoom();

          datasets.forEach(dataset => {
            document.getElementById(dataset.containerId).style.display = "block"; // Show all graphs
          });

          updateLegend(datasets.map(d => d.label)); // Restore all labels
        }
        function resetZoom() {
          datasets.forEach(dataset => {
              const svg = d3.select(`#${dataset.id}`);

              const graphGroup = svg.select(".graph-group");

              // Transition to reset the transform on the <g> group
              svg.transition()
                  .duration(750)
                  .call(
                      d3.zoom().transform, 
                      d3.zoomIdentity, 
                      d3.zoomTransform(graphGroup.node()).invert([0, 0])
                  );
                  graphGroup.attr("transform", null);

          });
      }

        function resetHighlights() {
          d3.selectAll(".nodes circle")
            .style("stroke", "#000")
            .style("stroke-width", "1.5px")
            .style("opacity", 1);

          updateLegend(datasets.map(d => d.label)); // Restore all labels
        }




        function focusOnCategory(category) {
        // Reset all nodes and links first
        resetAll();

        // Find the dataset corresponding to the selected category
        const targetDataset = datasets.find(dataset => dataset.label === category);

        if (!targetDataset) {
            console.error(`Category "${category}" not found in datasets.`);
            return;
        }

        // Select the target graph's nodes and links
        const graphGroup = d3.select(`#${targetDataset.id} .graph-group`);

        // Highlight nodes for the selected category
        graphGroup.selectAll(".nodes circle")
            .style("opacity", 1)
            .style("stroke", "#ff0000")
            .style("stroke-width", "3px");

        // Highlight links for the selected category
        graphGroup.selectAll(".links line")
            .style("opacity", 1)
            .style("stroke", "#ff0000")
            .style("stroke-width", "2px");
    }



function highlightStateAcrossAllGraphs(stateId) {
  // Reset all nodes and links
  d3.selectAll(".nodes circle")
    .style("stroke", "#000")
    .style("stroke-width", "1.5px")
    .style("opacity", 0.3); // Dim all nodes

  d3.selectAll(".links line").style("opacity", 0.3); // Dim all links

  const matchedGraphs = []; // Store the graphs that contain the state

  // Find the graph dataset and hierarchy for the given state
  datasets.forEach(dataset => {
    const svg = d3.select(`#${dataset.id}`);
    const graphGroup = svg.select(".graph-group");
    const nodes = graphGroup.selectAll("circle").data();
    const links = graphGroup.selectAll("line").data();

    // Find the target node
    const targetNode = nodes.find(d => d.id === stateId);
    if (!targetNode) {
      // If the state is not found in the graph, hide the graph
      document.getElementById(dataset.containerId).style.display = "none";
      return;
    }

    // If the state exists in the graph, add it to matchedGraphs
    matchedGraphs.push(dataset.label);
    document.getElementById(dataset.containerId).style.display = "block";

    // Traverse the hierarchy to find the full path
    const path = [];
    let currentNode = targetNode;
    while (currentNode && currentNode.parent) {
      path.unshift(currentNode);
      currentNode = nodes.find(d => d.id === currentNode.parent);
    }
    if (currentNode) path.unshift(currentNode); // Include the root node

    // Highlight nodes along the path
    graphGroup.selectAll("circle")
      .filter(d => path.some(p => p.id === d.id))
      .style("stroke", "#ff0000")
      .style("stroke-width", "3px")
      .style("opacity", 1);

    // Highlight links along the path
    for (let i = 0; i < path.length - 1; i++) {
      const source = path[i].id;
      const target = path[i + 1].id;
      graphGroup.selectAll("line")
        .filter(link => (link.source.id === source && link.target.id === target) ||
                        (link.source.id === target && link.target.id === source))
        .style("stroke", "#ff0000")
        .style("stroke-width", "2px")
        .style("opacity", 1);
    }
  });

  // Update the legend dynamically
  updateLegend(matchedGraphs);
}

function updateLegend(visibleLabels) {
  // Clear the current legend
  legendContainer.html("");

  // Recreate the legend for the visible labels
  visibleLabels.forEach(label => {
    const dataset = datasets.find(d => d.label === label);
    if (dataset) {
      const legendItem = legendContainer.append("div");
      legendItem.append("span").style("background-color", dataset.rootColor);
      legendItem.append("span").text(label);
    }
  });
}





function saveDashboardState() {
    const state = {
        filters: {
            tobacco: document.getElementById("filter-tobacco-affected-tb-patients").checked,
            alcohol: document.getElementById("filter-alcoholic-tb-patients").checked,
            diabetes: document.getElementById("filter-diabetic-tb-patients").checked,
        },
        graphVisibility: {},
        zoomLevels: {},
    };

    datasets.forEach(dataset => {
        const svg = d3.select(`#${dataset.id}`);
        const zoomTransform = d3.zoomTransform(svg.node());

        state.graphVisibility[dataset.id] = document.getElementById(dataset.containerId).style.display === "block";
        state.zoomLevels[dataset.id] = {
            x: zoomTransform.x || 0,
            y: zoomTransform.y || 0,
            k: zoomTransform.k || 1,
        };
    });

    localStorage.setItem("dashboardState", JSON.stringify(state));
    console.log("Saved State:", state);
}

function loadDashboardState() {
    const savedState = localStorage.getItem("dashboardState");
    if (!savedState) {
        console.warn("No saved state found.");
        return;
    }

    try {
        const state = JSON.parse(savedState);
        console.log("Loaded State:", state);

        document.getElementById("filter-tobacco-affected-tb-patients").checked = state.filters?.tobacco ?? true;
        document.getElementById("filter-alcoholic-tb-patients").checked = state.filters?.alcohol ?? true;
        document.getElementById("filter-diabetic-tb-patients").checked = state.filters?.diabetes ?? true;

        document.getElementById("filter-tobacco-affected-tb-patients").dispatchEvent(new Event("change"));
        document.getElementById("filter-alcoholic-tb-patients").dispatchEvent(new Event("change"));
        document.getElementById("filter-diabetic-tb-patients").dispatchEvent(new Event("change"));

        datasets.forEach(dataset => {
            const container = document.getElementById(dataset.containerId);
            container.style.display = state.graphVisibility?.[dataset.id] ? "block" : "none";

            const zoomTransform = state.zoomLevels?.[dataset.id] || { x: 0, y: 0, k: 1 };
            const svg = d3.select(`#${dataset.id}`);
            svg.call(d3.zoom().transform, d3.zoomIdentity.translate(zoomTransform.x, zoomTransform.y).scale(zoomTransform.k));
        });
    } catch (error) {
        console.error("Failed to parse saved state:", error);
    }
}

        // Attach event listener to the "Save State" button
        document.getElementById("save-state-button").addEventListener("click", () => {
            saveDashboardState();
            console.log("State saved manually by the user.");
        });

        document.getElementById("reset-state-button").addEventListener("click", () => {
            localStorage.removeItem("dashboardState");

        });

        // Attach event listeners to save the state on checkbox changes
        document.querySelectorAll("input[type=checkbox]").forEach(checkbox => {
            checkbox.addEventListener("change", saveDashboardState);
        });

        // Save the state when zooming
        datasets.forEach(dataset => {
            const svg = d3.select(`#${dataset.id}`);
            const zoomBehavior = d3.zoom();
            svg.call(
                zoomBehavior.on("zoom", () => {
                    saveDashboardState();
                })
            );
        });

        // Load state on page load
        document.addEventListener("DOMContentLoaded", () => {
            console.log("Page loaded. Attempting to restore dashboard state...");
            loadDashboardState();
        });

        function saveGraphAsImage(targetId) {
          const svgElement = document.getElementById(targetId); // Get the SVG element
          if (!svgElement) {
            console.error(`SVG element with ID "${targetId}" not found.`);
            return;
          }

          // Create a canvas element
          const canvas = document.createElement("canvas");
          canvas.width = svgElement.clientWidth || 600;
          canvas.height = svgElement.clientHeight || 600;

          // Render the SVG onto the canvas using Canvg
          const ctx = canvas.getContext("2d");
          const svgData = new XMLSerializer().serializeToString(svgElement);

          // Check if Canvg is loaded and render
          if (window.canvg) {
            window.canvg(canvas, svgData); // Render the SVG to the canvas

            // Convert the canvas to an image
            const imgData = canvas.toDataURL("image/png");

            // Create a download link
            const downloadLink = document.createElement("a"); // Fixed typo here
            downloadLink.href = imgData;
            downloadLink.download = `${targetId}.png`; // File name for the image
            downloadLink.click(); // Trigger the download
          } else {
            console.error("Canvg is not loaded. Ensure the script is properly linked.");
          }
        }


        document.querySelectorAll(".save-graph-button").forEach(button => {
          button.addEventListener("click", function () {
            const targetId = this.getAttribute("data-target"); // Get the target graph ID from the data attribute
            saveGraphAsImage(targetId);
          });
        });


        function updateBreadcrumbs(breadcrumbContainerId, path) {
    const container = document.getElementById(breadcrumbContainerId);
    if (!container) {
        console.error(`Breadcrumb container with ID "${breadcrumbContainerId}" not found.`);
        return; // Exit the function if the container is missing
    }

    container.innerHTML = ""; // Clear existing breadcrumbs

    // Create breadcrumb items
    path.forEach((node, index) => {
        const breadcrumbItem = document.createElement("span");
        breadcrumbItem.textContent = node.label; // Use label for display
        breadcrumbItem.dataset.index = index;

        // Add click handler to navigate back to this breadcrumb level
        breadcrumbItem.addEventListener("click", () => {
            const truncatedPath = path.slice(0, index + 1);
            updateBreadcrumbs(breadcrumbContainerId, truncatedPath);
        });

        // Append breadcrumb and separator
        container.appendChild(breadcrumbItem);

        if (index < path.length - 1) {
            const separator = document.createElement("span");
            separator.textContent = " > ";
            separator.classList.add("breadcrumb-separator");
            container.appendChild(separator);
        }
    });
}

      function createHierarchy(data, dataset) {
    const rootNode = `${dataset.label} Root`;

    // Define regions and their states
    const regionMapping = {
        North: ["Delhi", "Punjab", "Haryana", "Uttarakhand", "Jammu & Kashmir", "Himachal Pradesh", "Chandigarh"],
        South: ["Kerala", "Karnataka", "Tamil Nadu", "Andhra Pradesh", "Telangana", "Puducherry"],
        East: ["West Bengal", "Odisha", "Bihar", "Jharkhand", "Sikkim"],
        West: ["Rajasthan", "Gujarat", "Maharashtra", "Goa", "Dadra & Nagar Haveli and Daman & Diu"],
        Central: ["Madhya Pradesh", "Chhattisgarh", "Uttar Pradesh"],
        Northeast: ["Assam", "Meghalaya", "Nagaland", "Manipur", "Tripura", "Arunachal Pradesh", "Mizoram"],
    };

    // Step 1: Create region-level nodes
    const regions = Object.keys(regionMapping).map(region => ({
        id: region,
        group: 1, // Intermediate node
        parent: rootNode,
        label: region // For breadcrumbs
    }));

    // Step 2: Create state/UT nodes and assign to regions
    const stateNodes = data.map(d => {
        const state = d["state/uts"];
        const region = Object.keys(regionMapping).find(region =>
            regionMapping[region].includes(state)
        );
        return {
            id: state,
            group: 2, // Leaf node
            value: +d[dataset.column],
            details: d,
            parent: region || rootNode, // Assign directly to root if not found in mapping
            label: state // For breadcrumbs
        };
    });

    // Step 3: Combine all nodes
    const nodes = [
        { id: rootNode, group: 0, label: dataset.label }, // Root node
        ...regions,
        ...stateNodes
    ];

    // Step 4: Create links between nodes
    const links = nodes
        .filter(node => node.parent)
        .map(node => ({
            source: node.parent,
            target: node.id,
            value: Math.random()
        }));

    return { nodes, links };
}


    function highlightFullPath(path, links, graphGroup) {
        // Reset all styles first
        graphGroup.selectAll("circle")
            .attr("stroke", "none")
            .attr("stroke-width", 1)
            .attr("opacity", 0.3); // Dim all nodes

        graphGroup.selectAll("line")
            .attr("stroke", "#999")
            .attr("opacity", 0.3); // Dim all links

        // Highlight nodes along the path
        path.forEach((node, index) => {
            graphGroup.selectAll("circle")
                .filter(d => d.id === node.id)
                .attr("stroke", "#ff5722")
                .attr("stroke-width", 3)
                .attr("opacity", 1); // Bring node back to full opacity
        });

        // Highlight links along the path
        for (let i = 0; i < path.length - 1; i++) {
            const source = path[i].id;
            const target = path[i + 1].id;

            graphGroup.selectAll("line")
                .filter(link => (link.source.id === source && link.target.id === target) || 
                                (link.source.id === target && link.target.id === source))
                .attr("stroke", "#ff5722")
                .attr("stroke-width", 2)
                .attr("opacity", 1); // Bring link back to full opacity
        }
    }
